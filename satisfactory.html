<style>

  #app { display:flex; height:100vh; height:100dvh; }
  #sidebar { width:300px; background:#151b2e; padding:16px; overflow-y:auto; box-shadow:2px 0 6px rgba(0,0,0,0.4); z-index:1000; flex-shrink:0; }
  #map { flex:1; background:#0a0f1e; }
  #menu-btn { display:none; position:fixed; top:10px; left:10px; z-index:1001; width:44px; height:44px; background:#151b2e; border:1px solid #3a4670; border-radius:8px; color:#e8e8e8; font-size:22px; cursor:pointer; line-height:1; }

  .layer-row:hover { background:rgba(255,255,255,0.04); }
  .layer-row input { cursor:pointer; width:18px; height:18px; }
  .swatch { width:16px; height:16px; border-radius:50%; flex-shrink:0; border:2px solid rgba(0,0,0,0.4); }
  .layer-name { flex:1; font-size:14px; }
  .layer-count { font-size:12px; color:#8a93a8; font-variant-numeric: tabular-nums; }
  .layer-count .done { color:#7dd87f; }
  .opt { display:flex; align-items:center; gap:10px; font-size:14px; padding:10px 6px; cursor:pointer; }
  .opt input { width:18px; height:18px; }
  button { width:100%; padding:12px; margin-top:8px; background:#2a3556; color:#e8e8e8; border:1px solid #3a4670; border-radius:6px; cursor:pointer; font-size:13px; }
  button:active { background:#3a4670; }
  button.danger { background:#5a2b2b; border-color:#7a3b3b; }
  button.danger:active { background:#7a3b3b; }
  .total { font-size:13px; color:#8a93a8; margin-top:4px; padding-top:8px; border-top:1px solid #2a3556; }
  .total strong { color:#e8e8e8; }
  .leaflet-tooltip { background:#151b2e; border:1px solid #3a4670; color:#e8e8e8; font-size:12px; }
  .leaflet-tooltip-top:before { border-top-color:#3a4670; }
  .leaflet-popup-content-wrapper { background:#151b2e; color:#e8e8e8; border:1px solid #3a4670; border-radius:6px; }
  .leaflet-popup-content { margin:10px 12px; }
  .leaflet-popup-tip { background:#151b2e; border:1px solid #3a4670; }
  .leaflet-control-zoom a { background:#151b2e !important; color:#e8e8e8 !important; border-color:#3a4670 !important; width:36px !important; height:36px !important; line-height:36px !important; font-size:20px !important; }
  .leaflet-marker-icon { cursor:pointer; }
  /* Mobile: collapse sidebar into a slide-in panel */
  @media (max-width: 768px) {
    #menu-btn { display:block; }
    #sidebar { position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); transition:transform 0.25s ease; padding-top:60px; }

    #sidebar.open ~ #backdrop, body.sidebar-open #backdrop { display:block; }

<script>
// === World <-> image coordinate mapping ============================
// Satisfactory in-game world bounds. Tweak these if markers don't line up.
// Defaults are the standard tile layer bounds used by satisfactory-calculator.
const WORLD = { minX: -418614, maxX: 1081708, minY: -469043, maxY: 1031420 };
const IMG = { width: 8192, height: 8192 };

// Convert in-game (x, y) to Leaflet [lat, lng] in image pixel space.
// Critical: in Leaflet CRS.Simple with bounds [[0,0],[H,W]], lat=0 is the
// BOTTOM of the image and lat=H is the TOP. In-game +Y points south (down
// on the map), so we must flip: a marker with low game-Y should appear
// near the top of the image (high lat).
function worldToPx(x, y) {
  const px = (x - WORLD.minX) / (WORLD.maxX - WORLD.minX) * IMG.width;
  const py = IMG.height - (y - WORLD.minY) / (WORLD.maxY - WORLD.minY) * IMG.height;
  return [py, px];
}

// === State (localStorage) =========================================
const STORAGE_KEY = 'satisfactory-tracker-v1';
let completed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let hideDone = localStorage.getItem('hide-done') === '1';
document.getElementById('hide-done').checked = hideDone;

const visibleLayers = new Set();  // layerIds currently shown

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
}

// === Map setup ====================================================
const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -3,
  maxZoom: 2,
  zoomSnap: 0.25,
  attributionControl: false,
});

const bounds = [[0, 0], [IMG.height, IMG.width]];
L.imageOverlay('satisfactory_map_bg.png', bounds).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds([[-500, -500], [IMG.height + 500, IMG.width + 500]]);

// === Marker rendering ==============================================
const markerById = new Map();        // id -> Leaflet marker
const markersByLayer = new Map();    // layerId -> [marker, ...]
const layerInfoById = new Map();     // layerId -> layer config

function makeIcon(color, isDone) {
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const size = isTouch ? 22 : 14;
  const inner = isDone ? '#555' : color;
  const stroke = isDone ? '#333' : '#000';
  return L.divIcon({
    className: '',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${inner};border:2px solid ${stroke};box-shadow:0 0 0 1px rgba(255,255,255,0.3);opacity:${isDone?0.4:1};"></div>`
  });
}

function addLayer(layer) {
  layerInfoById.set(layer.layerId, layer);
  const group = [];
  for (const m of layer.markers) {
    const [lat, lng] = worldToPx(m.x, m.y);
    const isDone = completed.has(m.id);
    const marker = L.marker([lat, lng], { icon: makeIcon(layer.color, isDone) });
    const itemTip = m.item ? `<br><span style="color:#aaa">${m.item}</span>` : '';
    const altTip = (m.z !== undefined) ? `<br><span style="color:#8a93a8;font-size:11px;">Alt: ${Math.round(m.z/100)}m</span>` : '';
    marker.bindTooltip(`<b>${layer.name}</b>${itemTip}${altTip}`, { direction: 'top', offset: [0, -4] });
    marker.bindPopup(() => buildPopup(m, layer), { closeButton: false, offset: [0, -4] });
    marker._nodeId = m.id;
    marker._layerId = layer.layerId;
    markerById.set(m.id, marker);
    group.push(marker);
  }
  markersByLayer.set(layer.layerId, group);
}

function buildPopup(m, layer) {
  const isDone = completed.has(m.id);
  const itemLine = m.item ? `<div style="color:#aaa;font-size:12px;">${m.item}</div>` : '';
  const altLine = (m.z !== undefined) ? `<div style="color:#8a93a8;font-size:11px;">Alt: ${Math.round(m.z/100)}m</div>` : '';
  const div = document.createElement('div');
  div.style.cssText = 'min-width:160px;color:#e8e8e8;';
  div.innerHTML = `
    <div style="font-weight:600;font-size:14px;">${layer.name}</div>
    ${itemLine}
    ${altLine}
    <label style="display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 0;cursor:pointer;font-size:14px;">
      <input type="checkbox" ${isDone?'checked':''} style="width:18px;height:18px;cursor:pointer;">
      <span>Collected</span>
    </label>
  `;
  div.querySelector('input').addEventListener('change', e => {
    if (e.target.checked) completed.add(m.id); else completed.delete(m.id);
    const marker = markerById.get(m.id);
    marker.setIcon(makeIcon(layer.color, e.target.checked));
    saveProgress();
    refreshCounts();
    if (hideDone && e.target.checked) {
      marker.closePopup();
      map.removeLayer(marker);
    }
  });
  return div;
}

function toggleNode(id) {
  const marker = markerById.get(id);
  const layer = layerInfoById.get(marker._layerId);
  if (completed.has(id)) {
    completed.delete(id);
    marker.setIcon(makeIcon(layer.color, false));
  } else {
    completed.add(id);
    marker.setIcon(makeIcon(layer.color, true));
    if (hideDone) map.removeLayer(marker);
  }
  saveProgress();
  refreshCounts();
}

function applyVisibility() {
  for (const [layerId, markers] of markersByLayer) {
    const layerOn = visibleLayers.has(layerId);
    for (const marker of markers) {
      const isDone = completed.has(marker._nodeId);
      const shouldShow = layerOn && (!hideDone || !isDone);
      if (shouldShow && !map.hasLayer(marker)) marker.addTo(map);
      if (!shouldShow && map.hasLayer(marker)) map.removeLayer(marker);
    }
  }
}

// === Sidebar ======================================================
function buildSidebar() {
  const container = document.getElementById('layers');
  container.innerHTML = '';
  for (const layer of NODE_DATA.layers) {
    const row = document.createElement('label');
    row.className = 'layer-row';
    row.innerHTML = `
      <input type="checkbox" data-layer="${layer.layerId}">
      <span class="swatch" style="background:${layer.color}"></span>
      <span class="layer-name">${layer.name}</span>
      <span class="layer-count" id="count-${layer.layerId}"></span>
    `;
    container.appendChild(row);
    row.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) visibleLayers.add(layer.layerId);
      else visibleLayers.delete(layer.layerId);
      applyVisibility();
    });
  }
}

function refreshCounts() {
  let totalAll = 0, totalDone = 0;
  for (const layer of NODE_DATA.layers) {
    const total = layer.markers.length;
    const done = layer.markers.filter(m => completed.has(m.id)).length;
    totalAll += total; totalDone += done;
    const el = document.getElementById(`count-${layer.layerId}`);
    if (el) el.innerHTML = `<span class="done">${done}</span>/${total}`;
  }
  const pct = totalAll === 0 ? 0 : Math.round(totalDone / totalAll * 100);
  document.getElementById('total').innerHTML = `<strong>${totalDone}</strong> / ${totalAll} complete (${pct}%)`;
}

// === Wire up ======================================================
document.getElementById('hide-done').addEventListener('change', e => {
  hideDone = e.target.checked;
  localStorage.setItem('hide-done', hideDone ? '1' : '0');
  applyVisibility();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Clear ALL completion progress? This cannot be undone.')) return;
  completed.clear();
  saveProgress();
  for (const [layerId, markers] of markersByLayer) {
    const layer = layerInfoById.get(layerId);
    for (const m of markers) m.setIcon(makeIcon(layer.color, false));
  }
  applyVisibility();
  refreshCounts();
});

document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify([...completed], null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `satisfactory-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const arr = JSON.parse(await file.text());
    if (!Array.isArray(arr)) throw new Error('not an array');
    completed = new Set(arr);
    saveProgress();
    for (const [layerId, markers] of markersByLayer) {
      const layer = layerInfoById.get(layerId);
      for (const m of markers) m.setIcon(makeIcon(layer.color, completed.has(m._nodeId)));
    }
    applyVisibility();
    refreshCounts();
    alert(`Imported ${arr.length} completed nodes.`);
  } catch (err) {
    alert('Could not read file: ' + err.message);
  }
  e.target.value = '';
});

// === Calibration mode =============================================
// When enabled, clicks on the map print the image pixel coords and the
// corresponding game-world coords. Use this to verify alignment.
let calibMode = false;
document.getElementById('calib-mode').addEventListener('change', e => {
  calibMode = e.target.checked;
  document.getElementById('map').style.cursor = calibMode ? 'crosshair' : '';
});
map.on('click', e => {
  if (!calibMode) return;
  const px = e.latlng.lng;
  const py = e.latlng.lat;
  // Inverse of worldToPx
  const gx = px / IMG.width * (WORLD.maxX - WORLD.minX) + WORLD.minX;
  const gy = (IMG.height - py) / IMG.height * (WORLD.maxY - WORLD.minY) + WORLD.minY;
  const line = `img(${px.toFixed(0)}, ${py.toFixed(0)})  world(${gx.toFixed(0)}, ${gy.toFixed(0)})`;
  const out = document.getElementById('calib-out');
  out.innerHTML = line + '<br>' + out.innerHTML.split('<br>').slice(0, 4).join('<br>');
});

// === Mobile sidebar toggle =========================================
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('backdrop');
document.getElementById('menu-btn').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
});
backdropEl.addEventListener('click', () => sidebarEl.classList.remove('open'));
// Auto-close when tapping a layer toggle on mobile? No — user might want to toggle several.
// But close when explicitly using a button.
document.querySelectorAll('#sidebar button').forEach(b => {
  // (handled per-button below; no global close)
});

// === Service worker for offline support ===========================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// === Boot =========================================================
buildSidebar();
for (const layer of NODE_DATA.layers) addLayer(layer);
applyVisibility();
refreshCounts();
</script>
